# Konfigurasi Nginx untuk Sistem Laporan Operasional PT KAI Divre I SU (RACHE)
# Simpan file ini di VPS: /etc/nginx/sites-available/rache

server {
    listen 80;
    server_name rache.us.ci;

    # Limit ukuran file upload (Laporan, Dokumen PDF, dll)
    client_max_body_size 25M;

    # Gzip Compression untuk performa cepat
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # 1. Reverse Proxy ke Backend API (Node.js Express di Port 5050)
    location /api/ {
        proxy_pass http://127.0.0.1:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # 2. Reverse Proxy untuk WebSocket / Real-time Notification (Socket.io)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5050/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Frontend Single Page Application (React 19 + Vite dist)
    location / {
        root /var/www/rache/current/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets (JS, CSS, Gambar)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
